#{extends 'main.html' /} #{set title:'Cadastrar-se | IF Lyrics' /} #{script
id:'usersScript' , src:'users.js', charset:'utf-8' /}

<div id="loginContainer">
  
  <h3>Cadastro</h3>
  <form
    id="loginform"
    action="@{Usuarios.cadastrar}"
    name="cadastroForm"
    onsubmit="return validarCadastro()"
    method="GET"
  >
  #{if flash.success}
  <div class="alert alert-success alert-dismissible fade show" role="alert">
    ${flash.success}
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="alert"
      aria-label="Close"
    ></button>
  </div>
  #{/if} #{if flash.error}
  <div class="alert alert-warning alert-dismissible fade show" role="alert">
    ${flash.error}
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="alert"
      aria-label="Close"
    ></button>
  </div>
  #{/if}
    <div id="errorMessage">teste de erro</div>
    <input
      type="text"
      name="newUser.firstname"
      class="txtSession"
      id="firstname"
      placeholder="Nome*"
      onfocus="removeErrorClass(this);"
      onblur="validarCadastro(this);"
    />
    <input
      type="text"
      name="newUser.lastname"
      id="lastname"
      class="txtSession"
      placeholder="Sobrenome*"
      onfocus="removeErrorClass(this);"
      onblur="validarCadastro(this);"
    />
    <input
      type="email"
      name="newUser.email"
      id="email"
      class="txtSession"
      placeholder="E-mail*"
      onfocus="removeErrorClass(this);"
      onblur="validarCadastro(this);"
    />
    <input
      type="password"
      name="newUser.password"
      id="password"
      class="txtSession"
      placeholder="Senha*"
      onfocus="removeErrorClass(this);"
      onblur="validarCadastro(this);"
    />
    <input
      type="password"
      name="newUser.confirmPassword"
      id="confirmPassword"
      class="txtSession"
      placeholder="Confirmar senha*"
      onfocus="removeErrorClass(this);"
      onblur="validarCadastro(this);"
    />
    <div class="lbl1">
      <h5>Sexo*:</h5>
      <select
        name="newUser.genero"
        id="genero"
        class="cmb1"
        onfocus="removeErrorClass(this);"
        onblur="validarCadastro(this);"
      >
        <option value="">Selecione</option>
        <option value="MASCULINO">Masculino</option>
        <option value="FEMININO">Feminino</option>
        <option value="NAO_BINARIO">Não Binário</option>
      </select>
    </div>
    <div class="lbl1">
      <h5>Estado*:</h5>
      <select
        name="newUser.endereco"
        class="cmb1"
        onfocus="removeErrorClass(this);"
        onblur="validarCadastro(this);"
      >
        <option value="">Selecione</option>
        <option value="AC">Acre</option>
        <option value="AL">Alagoas</option>
        <option value="AP">Amapá</option>
        <option value="AM">Amazonas</option>
        <option value="BA">Bahia</option>
        <option value="CE">Ceará</option>
        <option value="DF">Distrito Federal</option>
        <option value="ES">Espirito Santo</option>
        <option value="GO">Goiás</option>
        <option value="MA">Maranhão</option>
        <option value="MT">Mato Grosso</option>
        <option value="MS">Mato Grosso do Sul</option>
        <option value="MG">Minas Gerais</option>
        <option value="PA">Pará</option>
        <option value="PB">Paraíba</option>
        <option value="PR">Paraná</option>
        <option value="PE">Pernambuco</option>
        <option value="PI">Piauí</option>
        <option value="RJ">Rio de Janeiro</option>
        <option value="RN">Rio Grande do Norte</option>
        <option value="RS">Rio Grande do Sul</option>
        <option value="RO">Rondônia</option>
        <option value="RR">Roraima</option>
        <option value="SC">Santa Catarina</option>
        <option value="SP">São Paulo</option>
        <option value="SE">Sergipe</option>
        <option value="TO">Tocantins</option>
      </select>
    </div>
    <input type="submit" value="Cadastrar" class="buttonSession" />

    <a href="@{Usuarios.loginForm}" id="createLogin">Login</a>
  </form>
</div>
