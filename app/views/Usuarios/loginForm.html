#{extends 'main.html' /} 
#{set title:'Fazer login | IF Lyrics' /}
#{script id:'usersScript' , src:'users.js', charset:'utf-8' /}

<main id="conteudo" class="alinhar">
  #{if flash.success}
				<div class="alert alert-success alert-dismissible fade show" role="alert">
					${flash.success}
					<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
				</div>
			#{/if}
			
			#{if flash.error}
				<div class="alert alert-warning alert-dismissible fade show" role="alert">
					${flash.error}
					<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
				</div>
			#{/if}
  <div id="loginContainer">
    <form
      class="access-form"
      id="loginform"
      action="@{Usuarios.login}"
      name="loginForm"
      onsubmit="return validarLogin();"
      method="POST"
      >
      <h3>Login</h3>
      <div id="errorMessage">teste de erro</div>
      <input
        type="text"
        name="email"
        class="txtSession"
        placeholder="E-mail"
        onfocus="removeErrorClass(this);"
      />
      <input
        type="password"
        name="password"
        class="txtSession"
        placeholder="Senha"
        onfocus="removeErrorClass(this);"
      />
      <input type="submit" value="Entrar" class="buttonSession" />
      <a href="@{Usuarios.cadastroForm}" id="createLogin">Cadastre-se</a>
    </form>
  </div>
</main>
