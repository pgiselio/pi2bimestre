#{extends 'main.html' /}
#{set title:'Buscando por | IF Lyrics' /}


#{list musicas as musica}
    #{if musica.nome == nome}
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">#{musica.nome}</h5>
                <h6 class="card-subtitle mb-2 text-muted">#{musica.artista}</h6>
            </div>
        </div>
    #{/if}
#{/list}
