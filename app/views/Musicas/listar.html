#{extends 'main.html' /}
#{set title:'Buscando por | IF Lyrics' /}
#{stylesheet id:'music-list', src:'musiclist.css' /}


<div class="header">
    <h1>Músicas cadastradas</h1>
    <a class="btn" href="@{Musicas.form}"><i class="fas fa-plus"></i> Adicionar</a>
</div>
<section class="box">
    <div class="music-list">
        #{list items:musics, as:'music'}
        <div class="music">
            <div class="titles">
                <h3 class="card-title">${music.name}</h3>
                <h6 class="card-subtitle mb-2 text-muted">artista</h6>
            </div>
            <div class="actions">
                <a href="@{Musicas.detalhar(music.id)}" class="btn">Detalhar</a>
                <a href="@{Musicas.editar(music.id)}" class="btn"><i class="fas fa-pencil"></i></a>
                <a href="@{Musicas.delete(music.id)}" class="btn btn-danger"><i class="fas fa-trash"></i></a>
            </div>
        </div>
        #{/list}
        #{else}
        <h3>Nenhuma música cadastrada</h3>
        #{/else}
    </div>
</section>
